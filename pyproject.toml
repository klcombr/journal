[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journal"
version = "0.1.0"
description = "A tiny personal journal CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
journal = "journal.cli:main"

[tool.setuptools.packages.find]
include = ["journal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
