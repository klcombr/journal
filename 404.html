<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — journal</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f4f4f0; color: #000; font-family: "Space Grotesk", sans-serif;
      text-align: center; padding: 24px;
    }
    pre {
      font-family: "JetBrains Mono", monospace;
      border: 3px solid #000; background: #fff;
      box-shadow: 12px 12px 0 #000; border-radius: 18px;
      padding: 20px; font-size: clamp(0.7rem, 2.5vw, 1rem);
    }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; margin: 30px 0 10px; text-transform: uppercase; }
    p { font-weight: 500; }
    a { color: #000; text-decoration: underline; text-decoration-thickness: 2px; }
    a:hover { background: #000; color: #f4f4f0; }
  </style>
</head>
<body>
  <div>
    <pre>_  _  ____ ___  ____</pre>
    <h1>404 — page not found</h1>
    <p>This entry doesn't exist. Go back to the <a href="./">journal</a>.</p>
  </div>
</body>
</html>
