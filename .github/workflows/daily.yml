name: daily-entry

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Random sleep (varies commit time)
        run: sleep $(( RANDOM % 10800 ))

      - name: Pick number of commits (1-30)
        run: |
          N=$(( (RANDOM % 30) + 1 ))
          echo "Will make $N commits today."
          echo "N=$N" >> "$GITHUB_ENV"

      - name: Configure git
        run: |
          git config user.name "KL"
          git config user.email "181868205+klcombr@users.noreply.github.com"

      - name: Commit loop
        run: |
          for i in $(seq 1 "$N"); do
            LINE="- $(date -u +%Y-%m-%dT%H:%M:%SZ) entry"
            echo "$LINE" >> journal.md
            git add .
            git commit -m "daily entry"
            git push
            echo "commit $i/$N: $LINE"
            sleep $(( RANDOM % 600 ))
          done
