# Render Blueprint — https://render.com/docs/blueprint-spec
# Cria o sync server do journal com um clique (plano free).
#
# PERSISTENCE on free tier (no disks allowed):
#   Add a Supabase Postgres free database and set the env var DATABASE_URL
#   (or JOURNAL_DATABASE_URL) in the Render dashboard to its connection
#   string. The server then persists to Postgres, which survives redeploys.
#   Alternatively switch plan to "starter" and uncomment the `disk` block.
services:
  - type: web
    name: journal-server
    runtime: docker
    repo: https://github.com/klcombr/journal
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: JOURNAL_SECRET
        generateValue: true
      - key: JOURNAL_CORS_ORIGINS
        value: https://klcombr.github.io
    # --- persistence: disk on starter plan (~$7/mo) ---
    # disk:
    #   name: journal-data
    #   mountPath: /data
    #   sizeGB: 1
